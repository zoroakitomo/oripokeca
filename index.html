<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>オリジナルカードメーカー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#202631;font-family:system-ui,-apple-system,"Meiryo",sans-serif}
header{background:#275aa2;color:white;padding:16px 22px}header h1{font-size:21px;margin:0}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}
main{max-width:1300px;margin:20px auto;padding:0 14px;display:grid;grid-template-columns:minmax(320px,1fr) minmax(300px,430px);gap:20px;align-items:start}
.panel{background:white;border:1px solid #dce2ea;border-radius:13px;padding:17px;box-shadow:0 3px 12px #1720330a}
h2{font-size:17px;margin:0 0 14px}h3{font-size:14px;margin:18px 0 9px;border-bottom:1px solid #e5e9ef;padding-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:700;color:#475467;margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #cbd3df;border-radius:7px;font:inherit;font-size:14px;background:white;color:#202631}
textarea{min-height:60px;resize:vertical}.wide{grid-column:1/-1}.hint{font-size:11px;color:#778296;margin-top:4px}
.file{font-size:12px}.attack{border:1px solid #dfe4eb;border-radius:9px;padding:11px;margin:10px 0}.attack-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;margin-bottom:8px}
.energy-list{display:flex;flex-wrap:wrap;gap:7px}.energy-option{display:flex;align-items:center;gap:4px;font-size:11px;background:#f5f7fa;border:1px solid #e2e7ee;border-radius:18px;padding:4px 7px}.energy-option input{width:auto;margin:0}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e8edf4;color:#243044}button.primary{background:#2563eb;color:white}button.danger{background:#fff0f0;color:#b42318;padding:5px 9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.preview{position:sticky;top:14px;text-align:center}.preview canvas{width:min(100%,390px);height:auto;box-shadow:0 8px 28px #18223030;border-radius:7px;background:#ddd}.preview p{font-size:12px;color:#667085}
@media(max-width:800px){main{grid-template-columns:1fr}.preview{position:static;grid-row:1}.preview canvas{width:min(78vw,390px)}}
</style>
</head>
<body>
<header><h1>オリジナルカードメーカー</h1><p>画像・ワザ・特性を入力して、自分だけのカードを作成</p></header>
<main>
<section class="panel">
<h2>カードを編集</h2>
<div class="grid">
<div class="field"><label>カードの種類</label><select id="kind"><option value="pokemon">ポケモン</option><option value="item">グッズ</option><option value="tool">ポケモンのどうぐ</option><option value="support">サポート</option><option value="stadium">スタジアム</option></select></div>
<div class="field" id="stageField"><label>進化段階</label><select id="stage"><option value="basic">たね</option><option value="1">1進化</option><option value="2">2進化</option></select></div>
<div class="field">
  <label><input type="checkbox" id="exCheck" style="width:auto;"> ex</label>
</div>
<div class="field">
  <label>exの位置</label>
  <input type="range" id="exX" min="-200" max="200" value="0">
</div>
<div class="field"><label>カード名</label><input id="name" value="オリジナルポケモン"></div>
<div class="field" id="hpField"><label>HP</label><input id="hp" type="number" min="0" value="100"></div>
<div class="field" id="typeField"><label>タイプ</label><select id="type">
<option value="mizu">水</option><option value="honoo">炎</option><option value="kusa">草</option><option value="denki">雷</option><option value="aku">悪</option><option value="chou">超</option><option value="hagane">鋼</option><option value="ryuu">竜</option><option value="musyoku">無色</option><option value="tou">闘</option>
</select></div>
<div class="field" id="evolveField"><label>進化元の名前</label><input id="evolve" placeholder="例：〇〇"></div>
<div class="field wide"><label>カード画像（ポケモン・イラスト）</label><input class="file" id="art" type="file" accept="image/*"><div class="hint">カード中央のイラスト枠に自動で収まります。</div></div>
</div>
<div id="pokemonFields">
<h3>ワザ</h3>
<div id="attacks"></div>
<button type="button" id="addAttack">＋ ワザを追加</button>
<h3>弱点・抵抗力・にげる</h3>
<div class="grid">
<div class="field">
  <label>弱点タイプ</label>
  <select id="weakness">
    <option value="">なし</option>
    <option value="mizu">水</option>
    <option value="honoo">炎</option>
    <option value="kusa">草</option>
    <option value="denki">雷</option>
    <option value="aku">悪</option>
    <option value="chou">超</option>
    <option value="hagane">鋼</option>
    <option value="ryuu">竜</option>
    <option value="musyoku">無色</option>
    <option value="tou">闘</option>
  </select>
</div>
<div class="field">
  <label>抵抗タイプ</label>
  <select id="resistance">
    <option value="">なし</option>
    <option value="mizu">水</option>
    <option value="honoo">炎</option>
    <option value="kusa">草</option>
    <option value="denki">雷</option>
    <option value="aku">悪</option>
    <option value="chou">超</option>
    <option value="hagane">鋼</option>
    <option value="ryuu">竜</option>
    <option value="musyoku">無色</option>
    <option value="tou">闘</option>
  </select>
</div>
<div class="field"><label>にげるエネルギー数</label><select id="retreat"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
<div class="field"><label>作者名(任意)</label><input id="footer" placeholder="例：あきとも"></div>
</div>
</div>
<div id="trainerFields" hidden>
<h3>トレーナーズの説明</h3>
<div class="field"><label>説明文</label><textarea id="trainerText" rows="6" placeholder="カードの効果を入力"></textarea></div>
</div>
<div class="actions"><button class="primary" id="download">PNG画像を保存</button><button id="reset">入力をリセット</button></div>
<p class="hint">※このツールはファンメイドのカード作成用です。</p>
</section>
<section class="panel preview"><h2>カードプレビュー</h2><canvas id="card" width="868" height="1212"></canvas><p>カード内の文字はImpactを優先して表示します。入力内容は自動反映され、PNG保存できます。</p></section>
</main>
<script>
const A='';
const energy={mizu:'mizukiso.png',honoo:'honookiso.png',kusa:'kusakiso.png',denki:'denkikiso.png',aku:'akukiso.png',chou:'choukiso.png',hagane:'haganekiso.png',ryuu:'ryuukiso.png',musyoku:'musyokukiso.png',tou:'toukiso.png'};
const icons={mizu:'mizuene.png',honoo:'honooene.png',kusa:'kusaene.png',denki:'dennkiene.png',aku:'akuene.png',chou:'chouene.png',hagane:'haganeene.png',ryuu:'musyokuene.png',musyoku:'musyokuene.png',tou:'touene.png'};
const labels={mizu:'水',honoo:'炎',kusa:'草',denki:'雷',aku:'悪',chou:'超',hagane:'鋼',musyoku:'無色',tou:'闘'};
const files={};
function load(file){if(!files[file]){const im=new Image();im.onload=()=>draw();im.src=A+file;files[file]=im;}return files[file];}
const canvas=document.getElementById('card'),ctx=canvas.getContext('2d');
let artImage=null,attackCount=0;
const $=id=>document.getElementById(id);
const fields=['kind','stage','name','hp','type','evolve','retreat','footer','trainerText','trainerFooter','weakness','resistance'];
function addAttack(){
 const n=++attackCount,div=document.createElement('div');div.className='attack';div.dataset.attack=n;
 const typeControl=n===1?`<div class="field wide"><label>技1の種類</label><select class="atkType"><option value="attack">ワザ</option><option value="ability">特性</option></select></div>`:'';
 div.innerHTML=`<div class="attack-head"><span>技 ${n}${n===1?'（種類変更可）':'（ワザ固定）'}</span><button type="button" class="danger remove">削除</button></div>
 ${typeControl}
 <div class="grid"><div class="field"><label>技名</label><input class="atkName" value="${n===1?'ワザ1':'ワザ2'}"></div><div class="field damageField"><label>ダメージ</label><input class="atkDamage" value="30" placeholder="例：30+"></div>
  <div class="field wide energyField">
    <label>必要なエネルギー（最大4個）</label>
    <div class="energy-list">
      ${Array.from({length:4},(_,i)=>`
        <select class="energy-slot">
          <option value="">なし</option>
          ${Object.entries(labels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
        </select>
      `).join('')}
    </div>
  </div>
 <div class="field wide"><label>説明</label><textarea class="atkText" placeholder="技の説明"></textarea></div></div>`;
  if(n===1){
    div.querySelector('.remove').hidden=true;
  }else{
    div.querySelector('.remove').onclick=()=>{
      div.remove();
      $('addAttack').hidden=document.querySelectorAll('.attack').length>=2;
      draw();
    };
  }
const typeSelect=div.querySelector('.atkType');
 if(typeSelect)typeSelect.addEventListener('change',()=>{updateAttackControls(div);draw();});
 $('attacks').append(div);div.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',draw));div.querySelectorAll('select').forEach(el=>el.addEventListener('change',draw));
 updateAttackControls(div);draw();}

function updateAttackControls(div){
 const isAbility=div.querySelector('.atkType')?.value==='ability';
 const damage=div.querySelector('.damageField'),energyField=div.querySelector('.energyField');
 if(damage)damage.hidden=isAbility;
 if(energyField)energyField.hidden=isAbility;
}
$('addAttack').onclick=()=>{if(attackCount>=2)return;addAttack();$('addAttack').hidden=attackCount>=2};addAttack();addAttack();$('addAttack').hidden=attackCount>=2;
function val(id){return $(id).value}
function fitText(text,x,y,maxW,lineH,maxLines=5,font='24px Impact, Haettenschweiler, \"Arial Narrow Bold\", sans-serif',color='#202020'){
 ctx.font=font;ctx.fillStyle=color;let line='',lines=[];
 for(const ch of String(text||'')){if(ctx.measureText(line+ch).width>maxW&&line){lines.push(line);line=ch;}else line+=ch;}
 if(line)lines.push(line);lines.slice(0,maxLines).forEach((s,i)=>ctx.fillText(s,x,y+i*lineH));
}
function drawEnergy(type,x,y,size){if(!type)return;const im=load(icons[type]||icons.musyoku);if(im.complete&&im.naturalWidth)ctx.drawImage(im,x,y,size,size);}
function draw(){
 const kind=val('kind'),pokemon=kind==='pokemon',type=val('type');
 const textColor = type === 'aku' ? '#ffffff' : '#202020';
 $('stageField').hidden=!pokemon;$('hpField').hidden=!pokemon;$('typeField').hidden=!pokemon;$('evolveField').hidden=!pokemon;
 $('pokemonFields').hidden=!pokemon;$('trainerFields').hidden=pokemon;
 let bg=pokemon?(energy[type]||energy.musyoku):({item:'motimono.png',tool:'motimono.png',support:'sapoto.png',stadium:'sutajiamu.png'}[kind]||'guzzu.png');
 if(kind==='item')bg='guzzu.png';if(kind==='tool')bg='motimono.png';
 ctx.clearRect(0,0,868,1212);
 if(artImage){ctx.save();ctx.beginPath();ctx.rect(70,115,728,455);ctx.clip();let r=Math.max(728/artImage.width,455/artImage.height),w=artImage.width*r,h=artImage.height*r;ctx.drawImage(artImage,70+(728-w)/2,115+(455-h)/2,w,h);ctx.restore();}
 const frame=load(bg);if(frame.complete&&frame.naturalWidth)ctx.drawImage(frame,0,0,868,1212);else{ctx.fillStyle='#ddd';ctx.fillRect(0,0,868,1212);}
 if(pokemon){
   // illustration window
   if(val('stage')==='1'||val('stage')==='2'){const ov=load(val('stage')==='1'?'1sinnka.png':'2sinnka.png');if(ov.complete&&ov.naturalWidth)ctx.drawImage(ov,0,0,868,1212);ctx.font='bold 25px Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif';ctx.fillStyle='#333';ctx.fillText(val('evolve')+"から進化",165,133);}
   if($('exCheck').checked){const ex=load('EX.png');if(ex.complete&&ex.naturalWidth)ctx.drawImage(ex,Number(val('exX')),-5,868,1212);}
   ctx.textAlign = 'left';ctx.fillStyle=textColor;ctx.font='bold 43px Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif';ctx.fillText(val('name'),155,85,590);
   ctx.textAlign = 'center';ctx.font='bold 55px Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif';ctx.fillText((val('hp')||''),720,95);
   const attacks=[...document.querySelectorAll('.attack')];let y=700;
   attacks.forEach((el,i)=>{
     if(y>960)return;
     const isAbility=el.querySelector('.atkType')?.value==='ability';
     const energies=[...el.querySelectorAll('.energy-slot')].map(x=>x.value).filter(x=>x!=='');
     if(isAbility){
       const tokusei=load('TOKUSEI.png');if(tokusei.complete&&tokusei.naturalWidth)ctx.drawImage(tokusei,0,15);
     }else if(energies.length){
       energies.forEach((e,j)=>drawEnergy(e,75+j*43,y-32,38));
     }else{
       const none=load('enenasi.png');if(none.complete&&none.naturalWidth)ctx.drawImage(none,75,y-32,38,38);
     }
     ctx.fillStyle=isAbility?'#d71920':textColor;ctx.font='bold 40px Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif';
     ctx.fillText(el.querySelector('.atkName').value,430,y,isAbility?300:470);
     if(!isAbility){ctx.textAlign='right';ctx.font='bold 43px Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif';ctx.fillText(el.querySelector('.atkDamage').value,790,y);ctx.textAlign='left';}
     ctx.textAlign='left';fitText(el.querySelector('.atkText').value,80,y+34,700,25,2,'20px Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif',isAbility ? '#d71920' : textColor);
     y+=160;ctx.textAlign='center'
   });
   // 弱点タイプ
    const weakness=val('weakness');if(weakness){drawEnergy(weakness,130,1043,31);ctx.font='bold 30px Arial, sans-serif';ctx.fillStyle=textColor;ctx.fillText('×2',190,1070);}

    // 抵抗タイプが選択されている場合だけ描画
    const resistance=val('resistance');
    if(resistance){
      drawEnergy(resistance,365,1043,31);
      ctx.font='bold 30px Arial, sans-serif';
      ctx.fillStyle=textColor;
      ctx.fillText('-30',425,1070);
    }
   const retreat=Number(val('retreat'));for(let i=0;i<retreat;i++)drawEnergy('musyoku',610+i*38,1043,31);
   ctx.textAlign='left';ctx.font='18px Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif';ctx.fillStyle=textColor;ctx.fillText(val('footer'),710,1170,130);
  }else{
   ctx.fillStyle='#222';ctx.font='bold 43px Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif';ctx.textAlign='left';ctx.fillText(val('name'),80,140,700);
   fitText(val('trainerText'),80,840,700,35,11,'25px Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif');
 }
}
$('art').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{artImage=im;draw();};im.src=URL.createObjectURL(f);});
fields.forEach(id=>{const el=$(id);if(el) el.addEventListener('input',draw);});
$('retreat').addEventListener('change',draw);
$('weakness').addEventListener('change',draw);
$('resistance').addEventListener('change',draw);
$('exCheck').addEventListener('change',draw);
$('exX').addEventListener('input',draw);
$('download').onclick=async()=>{
  draw();

  const filename=(val('name')||'original-card')+'.png';
  const dataURL=canvas.toDataURL('image/png');

  // PNGデータをFileに変換
  const binary=atob(dataURL.split(',')[1]);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++){
    bytes[i]=binary.charCodeAt(i);
  }

  const blob=new Blob([bytes],{type:'image/png'});
  const file=new File([blob],filename,{type:'image/png'});

  // スマホの共有メニューを使用
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{
      await navigator.share({
        files:[file],
        title:filename
      });
      return;
    }catch(error){
      if(error.name==='AbortError')return;
    }
  }

  // 共有機能が使えない場合は通常ダウンロード
  const a=document.createElement('a');
  a.download=filename;
  a.href=dataURL;
  a.click();
};$('reset').onclick=()=>{if(!confirm('入力内容をリセットしますか？'))return;location.reload();};
draw();
</script>
</body></html>
